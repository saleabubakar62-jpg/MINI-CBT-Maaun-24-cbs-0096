<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>
<body>
    <h2>Answer the questions</h2>

    <form method="POST">
        {% for q in questions %}
            <p>{{ q.text }}</p>
            <input type="text" name="q{{ loop.index0 }}" required>
            <br><br>
        {% endfor %}

        <button type="submit">Submit</button>
    </form>
</body>
</html>
